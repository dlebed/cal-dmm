# Fluke 5700A / 5720A fault codes -- OFFLINE decode table.
#
# GENERATED FILE.  Do not hand-edit.  It is a dump of
# ``caldmm.drivers.fluke5700a.FAULT_CODES``, which merges the Remote
# Programming Guide section 12.1 table (reviewed against real EXPLAIN?
# output; its wording wins on overlap) with the complete 692-code Service
# Manual chapter-4 table (docs/5700a/fluke5700a-fault-codes.md).  That dict is the
# transcription of record; this file is a copy of it, and re-typing these 692 lines by hand
# would have created a second, unreviewed source that then drifts.
#
# WHY THE DATA EXISTS TWICE.  ``caldmm.cal`` may not import a driver at run
# time (see the import-hygiene note at the top of ``cal/specs.py``), so the
# analyzer cannot reach the driver's dict.  It also must not depend on the
# calibrator's own ``EXPLAIN?``: a unit sick enough to be worth diagnosing is
# exactly the unit whose EXPLAIN? cannot be trusted, and bench-side analysis
# often runs with no instrument attached at all.
#
# WHY IT CANNOT DRIFT.  ``tests/cal/test_fault_table.py`` asserts this file and
# the driver's dict are *exactly* equal -- same keys, same strings.  Editing
# either one alone fails that test.  To change a message, change the driver and
# regenerate this file with ``yaml.safe_dump({"faults": FAULT_CODES},
# default_flow_style=False, width=100, sort_keys=True)`` under this header.
#
# THIS IS NOT A MODEL SPECIFICATION.  It has no ``schema_version`` and
# ``load_model("fluke5700a_faults")`` will refuse it.  ``available_models()``
# lists every ``*.yaml`` in this package by file name, so the name does appear
# there; that is a property of the listing, not a claim that it is a model.
#
