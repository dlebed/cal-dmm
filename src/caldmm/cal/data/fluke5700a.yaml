# Fluke 5700A / 5720A Series II multifunction calibrator -- specification file.
#
# SOURCE.  Fluke 5700A/5720A Series II Remote Programming Guide (a markdown
# transcription of the Operator and Remote Programming manuals), which is itself sourced from the Operator Manual as amended by change notice
# MS9 ("replace the entire Specification section").  Sections used:
#
#   10        range identifiers (RANGE?, CAL_RNG, CAL_SHIFT?)
#   11.1-11.2 overall capability, ranges, resolutions, minimum outputs
#   11.5      settling times
#   18.1      supported functions and ranges at a glance
#   18.3      dc voltage accuracy
#   18.4      ac voltage accuracy
#   18.5      resistance accuracy
#   18.6      dc current accuracy
#   18.7      ac current accuracy
#
# Conditions the guide does not reproduce (two-wire adders, load-current
# windows and their derating constants, the current-squared adders, the
# temperature window, the stated confidence) are cited against the manual text
# itself, as `[OM 1996] line N (PDF p.M)`:
#
#   [OM 1996]  5700A/5720A Series II Operators Manual, May 1996, PN 601622.
#              Line numbers refer to a text extract
#              `5700a-operators-manual-1996.txt` (not shipped).
#   [MS5]      Operators Manual Supplement issue 5, 1/09; change #1 replaces
#              OM p.1-42, the wideband page.  Text extract
#              `5700a-operators-supplement-2009.txt`.
#   [MS9]      Operators Manual Supplement issue 9, 11/14, "replace the entire
#              Specification section".  Text extract
#              `5700a-operators-supplement-2014.txt`.
#
# A PDF page is 1 + the number of form feeds before the cited line.
#
# ---------------------------------------------------------------------------
# THE TABLES BELOW ARE A CROSS-CHECK, NOT THE VERDICT
# ---------------------------------------------------------------------------
#
# `limits_authority: instrument`.  Unlike every meter in this directory, this
# instrument computes its own uncertainty: `UNCERT?` returns the figure for the
# output actually programmed, honouring CAL_INTV, CAL_CONF, the selected range,
# the frequency and the calibration temperature, in firmware (guide 18.10:
# "A driver should not reimplement these accuracy tables ... UNCERT? does it in
# firmware").  These tables exist so that a run can be planned and validated
# with no instrument attached, and so that a disagreement between file and
# firmware is visible rather than silent.  At run time UNCERT? wins.
#
# The primary purpose of this file is therefore the ENVELOPE -- which ranges
# exist, what they are called over the bus, what they can and cannot source --
# not the accuracy figures.
#
# ---------------------------------------------------------------------------
# WHAT IS AND IS NOT HERE
# ---------------------------------------------------------------------------
#
# CARRIED: the 5700A/5720A's own ranges for dc volts, ac volts, dc current,
# ac current and resistance, with their guide-10 range identifiers, minimum
# outputs, resolutions and settling times; the ac frequency bands; the
# 2.2e7 V-Hz ac ceiling; the 1100 V ac range's 15 Hz - 1 kHz window and its
# 250 V cap from 15 to 50 Hz; the 9 uA floor on the ac 220 uA range; the
# 17 standard resistances plus the short, with the connections each allows.
#
# NOT CARRIED, and why:
#  * The 95 % confidence figures.  CAL_CONF selects 99 % or 95 %, and the
#    schema has one limits axis (the interval).  The 99 % column is the one
#    printed in full for every range and interval, so it is the one here.  A
#    run made with CAL_CONF 95 must take UNCERT? as authority -- which it
#    should anyway.
#  * Relative uncertainty (the post-CAL_RNG figures) and the secondary
#    performance / operating-characteristic tables (stability, linearity,
#    noise, load and line regulation).
#  * The auxiliary-amplifier ranges (5725A, 5205A, 5215A, 5220A).  They exist
#    only when BTYPE names an attached amplifier, and the driver's own range
#    tables exclude them too.
#  * (No longer true of wideband: the WBV function below carries the
#    Option 5700A-03 tables from [MS5] change #1 -- see the last section of
#    this file and docs/5700a/fluke5700a-wideband-specifications.md.  A plan will
#    only pair wideband points against a meter whose model file also
#    declares WBV.)
#  * (No longer true of the temperature window: `temperature:` below carries
#    the "+/-5 C from calibration temperature" rule as a RELATIVE window whose
#    centre is CAL_TEMP?, read from the instrument.  The calibration
#    temperature range itself is 15 C to 35 C, operating 0 C to 50 C, and
#    neither is a window on these figures.)
#  * (No longer true of the current-squared adders: the dc 220 mA and 2.2 A
#    ranges below carry footnote [1]'s +/-200 x I^2 and +/-10 x I^2 ppm.)
#    Still not carried: the 1.3x (plus 2 uA on ac) penalty when the 220 uA /
#    2.2 mA ranges are supplied through 5725A terminals.
#  * (No longer true of the resistance load window: every resistance range
#    below carries `load_current:` -- IL, IU, IMAX and the manual's derating
#    constants K.  They are TEST CONDITIONS, not tolerance terms; nothing in
#    evaluate_limit uses them, and plan generation is what has to.)
#    Still not carried: compliance voltage, and the ac/dc voltage and current
#    load limits, which bound a connection rather than a tolerance.
#  * DC zeros.  The dc voltage specifications require CAL_ZERO at least every
#    30 days (guide 11.6); fault 1303 flags it.  Check CAL_DAYS? ZERO.
#
schema_version: 1
model_id: fluke5700a
display_name: "Fluke 5700A/5720A Series II multifunction calibrator"
role: source
driver: {module: caldmm.drivers.fluke5700a, cls: Fluke5700A}
adapter: "caldmm.cal.adapters:Fluke5700ASource"

# A source returns no readings, so it has no invalid-reading sentinel.  Stated
# explicitly because the schema will not let it be silently absent.  (UNCERT?
# returns -1.0 to mean "no specification available", which is a query result,
# not a measurement sentinel, and belongs to the driver.)
overload_sentinel: null

# Intervals run from the last calibration, and are exactly the four CAL_INTV
# accepts: 1, 90, 180 and 365 days (guide 18.10).
interval_basis: since_cal
limits_authority: instrument
intervals: [24h, 90d, 180d, 1y]
default_interval: 1y

# The confidence the transcribed columns are stated at.  [OM 1996] lines
# 1107-1110 (PDF p.30), section 1-24 "Specification Confidence Levels": "the
# primary performance specifications ... are provided at both the 99 % and
# 95 % confidence levels"; line 1213-1214 (PDF p.33): "Fluke guarantees
# performance verification using specifications stated to 99% confidence
# level."  Every table below is the 99 % column, so a budget that treats one
# of these numbers as a rectangular bound over-states it by ~49 %.
spec_confidence: 0.99

# The window every table in this file is written for.  [OM 1996] line 1220
# (PDF p.33) and the same header on every primary table: "Absolute Uncertainty
# / +/- 5 C from calibration temperature"; lines 1301-1302 (PDF p.35), dc
# voltage secondary note 2: "Temperature coefficient is an adder to
# uncertainty specifications that does not apply unless operating more than
# +/-5 C from calibration temperature."
#
# The centre is not a constant and is not in this file: it is CAL_TEMP?, the
# temperature the instrument was last calibrated at, which the runner reads
# and hands to `window_for(reference_c=...)`.
#
# NOT expressible here, and left to the operator: resistance secondary note 2
# ([OM 1996] lines 2012-2016, PDF p.49) additionally requires CAL_TEMP itself
# to lie in 19 C - 24 C -- "Calibrate at 26 C: Add 2 C temperature coefficient
# adder" -- which is a condition on the stored calibration temperature, not on
# the ambient this window compares against.
temperature: {relative_to: cal_temp, half_width_c: 5.0}

notes: >-
  Absolute uncertainty, 99 % confidence, +/-5 C from calibration temperature,
  after a warm-up of twice the time since last warmed up to a maximum of 30
  minutes (ONTIME?).  "Absolute uncertainty includes stability, temperature
  coefficient, linearity, line and load regulation, and the traceability to
  external standards", so nothing is added to it for a test-uncertainty ratio.

  Resistance is a DISCRETE CATALOGUE, not a continuum: 17 values plus a short,
  and anything else faults.  Each is sourced as a *characterized* value up to
  500 ppm from nominal, so the reference for an error computation is what OUT?
  returns, never the requested nominal.  Every resistance range below carries
  characterized: true for that reason.


functions:

  # ------------------------------------------------------------------ DC V --
  # guide 18.3, 99 % confidence: +/- (ppm of output + uV).  There is no
  # "ppm of range" term at all on this instrument -- the second figure is an
  # absolute floor in volts, which is exactly what abs_floor is for.
  - quantity: DCV
    func: DCV
    connections: [2w]
    settle_s: 3.0            # guide 11.5; add 1 s for a range or polarity change
    ranges:
      - fs: 0.22
        range_id: DC220MV
        resolution: 1e-08
        min_out: 0.0
        settle_s: 3.0
        source_impedance_ohm: 50.0
        note: "50 Ohm output impedance (guide 11.2, 18.3): into a 10 MOhm
               meter that is 5 ppm, larger than several floors in this file"
        limits:
          24h:   {ppm_reading: 6.5, abs_floor: 7.5e-07}
          90d:   {ppm_reading: 7.0, abs_floor: 7.5e-07}
          180d:  {ppm_reading: 8.0, abs_floor: 7.5e-07}
          1y:    {ppm_reading: 9.0, abs_floor: 8e-07}

      - fs: 2.2
        range_id: DC2_2V
        resolution: 1e-07
        min_out: 0.0
        settle_s: 3.0
        limits:
          24h:   {ppm_reading: 3.5, abs_floor: 1.2e-06}
          90d:   {ppm_reading: 6.0, abs_floor: 1.2e-06}
          180d:  {ppm_reading: 7.0, abs_floor: 1.2e-06}
          1y:    {ppm_reading: 8.0, abs_floor: 1.2e-06}

      - fs: 11.0
        range_id: DC11V
        resolution: 1e-06
        min_out: 0.0
        settle_s: 3.0
        limits:
          24h:   {ppm_reading: 3.5, abs_floor: 3e-06}
          90d:   {ppm_reading: 5.0, abs_floor: 4e-06}
          180d:  {ppm_reading: 7.0, abs_floor: 4e-06}
          1y:    {ppm_reading: 8.0, abs_floor: 4e-06}

      - fs: 22.0
        range_id: DC22V
        resolution: 1e-06
        min_out: 0.0
        settle_s: 3.0
        limits:
          24h:   {ppm_reading: 3.5, abs_floor: 6e-06}
          90d:   {ppm_reading: 5.0, abs_floor: 8e-06}
          180d:  {ppm_reading: 7.0, abs_floor: 8e-06}
          1y:    {ppm_reading: 8.0, abs_floor: 8e-06}

      - fs: 220.0
        range_id: DC220V
        resolution: 1e-05
        min_out: 0.0
        settle_s: 3.0
        limits:
          24h:   {ppm_reading: 5.0, abs_floor: 0.0001}
          90d:   {ppm_reading: 6.0, abs_floor: 0.0001}
          180d:  {ppm_reading: 8.0, abs_floor: 0.0001}
          1y:    {ppm_reading: 9.0, abs_floor: 0.0001}

      - fs: 1100.0
        range_id: DC1100V
        resolution: 0.0001
        min_out: 100.0
        settle_s: 4.0
        note: "the only dc range with a non-zero minimum output, 100 V
               (guide 11.2); settle_s already includes its +1 s"
        limits:
          24h:   {ppm_reading: 7.0, abs_floor: 0.0006}
          90d:   {ppm_reading: 8.0, abs_floor: 0.0006}
          180d:  {ppm_reading: 10.0, abs_floor: 0.0006}
          1y:    {ppm_reading: 11.0, abs_floor: 0.0006}

  # ------------------------------------------------------------------ DC I --
  # guide 18.6.  WATCH THE FLOOR UNITS: the table prints nA on the 220 uA,
  # 2.2 mA and 22 mA rows and uA on the 220 mA and 2.2 A rows.  Everything
  # below is in amps.
  - quantity: DCI
    func: DCI
    connections: [2w]
    settle_s: 1.0            # guide 11.5: 1 s for uA/mA, 3 s for 2.2 A
    ranges:
      - fs: 0.00022
        range_id: DC220UA
        resolution: 1e-10
        min_out: 0.0
        settle_s: 1.0
        limits:
          24h:   {ppm_reading: 45.0, abs_floor: 1e-08}
          90d:   {ppm_reading: 50.0, abs_floor: 1e-08}
          180d:  {ppm_reading: 55.0, abs_floor: 1e-08}
          1y:    {ppm_reading: 60.0, abs_floor: 1e-08}

      - fs: 0.0022
        range_id: DC2_2MA
        resolution: 1e-09
        min_out: 0.0
        settle_s: 1.0
        limits:
          24h:   {ppm_reading: 45.0, abs_floor: 1e-08}
          90d:   {ppm_reading: 50.0, abs_floor: 1e-08}
          180d:  {ppm_reading: 55.0, abs_floor: 1e-08}
          1y:    {ppm_reading: 60.0, abs_floor: 1e-08}

      - fs: 0.022
        range_id: DC22MA
        resolution: 1e-08
        min_out: 0.0
        settle_s: 1.0
        limits:
          24h:   {ppm_reading: 45.0, abs_floor: 1e-07}
          90d:   {ppm_reading: 50.0, abs_floor: 1e-07}
          180d:  {ppm_reading: 55.0, abs_floor: 1e-07}
          1y:    {ppm_reading: 60.0, abs_floor: 1e-07}

      - fs: 0.22
        range_id: DC220MA
        resolution: 1e-07
        min_out: 0.0
        settle_s: 1.0
        # [OM 1996] lines 2176-2178 (PDF p.52), 5700A Series II DC Current
        # note 1: "Add to uncertainty specifications: +/-200 x I2 ppm for
        # >100 mA on 220 mA range".  Same footnote in [MS9] lines 1085-1087
        # (PDF p.19).  I is in amperes, so the coefficient is the manual's own
        # 200 with isq_ref_a 1 A; "> 100 mA" is strict, which isq_above_a is.
        #   at 220 mA: 200 x 0.22^2 = 9.68 ppm on top of the row.
        ppm_reading_isq: 200.0
        isq_ref_a: 1.0
        isq_above_a: 0.1
        limits:
          24h:   {ppm_reading: 55.0, abs_floor: 1e-06}
          90d:   {ppm_reading: 60.0, abs_floor: 1e-06}
          180d:  {ppm_reading: 65.0, abs_floor: 1e-06}
          1y:    {ppm_reading: 70.0, abs_floor: 1e-06}

      - fs: 2.2
        range_id: DC2_2A
        resolution: 1e-06
        min_out: 0.0
        settle_s: 3.0
        note: "compliance 2 V from 1 A to 2.2 A"
        # [OM 1996] lines 2176-2178 (PDF p.52), note 1: "+/-10 x I2 ppm for
        # >1 A on 2.2 A range"; [MS9] lines 1085-1087 (PDF p.19).
        #   at 2.2 A: 10 x 2.2^2 = 48.4 ppm, so the one-year figure is
        #   143.4 ppm + 30 uA, not 95 ppm + 30 uA -- 345.48 uA rather than
        #   239 uA, 45 % wider at full scale.
        ppm_reading_isq: 10.0
        isq_ref_a: 1.0
        isq_above_a: 1.0
        limits:
          24h:   {ppm_reading: 75.0, abs_floor: 3e-05}
          90d:   {ppm_reading: 80.0, abs_floor: 3e-05}
          180d:  {ppm_reading: 90.0, abs_floor: 3e-05}
          1y:    {ppm_reading: 95.0, abs_floor: 3e-05}

  # ------------------------------------------------------------------ AC V --
  # guide 18.4.  WATCH THE FLOOR UNITS: uV on every row EXCEPT 220 V and
  # 1100 V, which the table prints in mV.  Everything below is in volts.
  #
  # The envelope constraints a plan validator needs are all here:
  #   * volt_hertz_max 2.2e7 -- programming outside it is fault 820
  #   * min_out, 10 % of range on every ac range
  #   * the 1100 V range exists only from 15 Hz to 1 kHz, and is capped at
  #     250 V from 15 to 50 Hz (max_out on that band)
  - quantity: ACV
    func: ACV
    connections: [2w]
    settle_s: 7.0            # guide 11.5 worst case: 7 s below 20 Hz.  Every ac
                             # range has a 10-20 Hz band, so 7 s is what the
                             # function must budget; 5 s covers 120 Hz-120 kHz
                             # and 2 s above 120 kHz only.
    volt_hertz_max: 2.2e+7   # guide 11.2, [OM Figure A p.1-28]; fault 820 beyond it
    ranges:
      - fs: 0.0022
        range_id: AC2_2MV
        resolution: 1e-09
        min_out: 0.00022       # 10 % of range (guide 11.2)
        source_impedance_ohm: 50.0   # guide 18.4 operating characteristics
        bands:
          - freq_hz: [10.0, 20.0]
            limits:
              24h:   {ppm_reading: 500.0, abs_floor: 5e-06}
              90d:   {ppm_reading: 550.0, abs_floor: 5e-06}
              180d:  {ppm_reading: 600.0, abs_floor: 5e-06}
              1y:    {ppm_reading: 600.0, abs_floor: 5e-06}
          - freq_hz: [20.0, 40.0]
            limits:
              24h:   {ppm_reading: 200.0, abs_floor: 5e-06}
              90d:   {ppm_reading: 220.0, abs_floor: 5e-06}
              180d:  {ppm_reading: 230.0, abs_floor: 5e-06}
              1y:    {ppm_reading: 240.0, abs_floor: 5e-06}
          - freq_hz: [40.0, 20000.0]
            limits:
              24h:   {ppm_reading: 100.0, abs_floor: 5e-06}
              90d:   {ppm_reading: 110.0, abs_floor: 5e-06}
              180d:  {ppm_reading: 120.0, abs_floor: 5e-06}
              1y:    {ppm_reading: 120.0, abs_floor: 5e-06}
          - freq_hz: [20000.0, 50000.0]
            limits:
              24h:   {ppm_reading: 340.0, abs_floor: 5e-06}
              90d:   {ppm_reading: 370.0, abs_floor: 5e-06}
              180d:  {ppm_reading: 390.0, abs_floor: 5e-06}
              1y:    {ppm_reading: 410.0, abs_floor: 5e-06}
          - freq_hz: [50000.0, 100000.0]
            limits:
              24h:   {ppm_reading: 800.0, abs_floor: 8e-06}
              90d:   {ppm_reading: 900.0, abs_floor: 8e-06}
              180d:  {ppm_reading: 950.0, abs_floor: 8e-06}
              1y:    {ppm_reading: 950.0, abs_floor: 8e-06}
          - freq_hz: [100000.0, 300000.0]
            limits:
              24h:   {ppm_reading: 1100.0, abs_floor: 1.5e-05}
              90d:   {ppm_reading: 1200.0, abs_floor: 1.5e-05}
              180d:  {ppm_reading: 1300.0, abs_floor: 1.5e-05}
              1y:    {ppm_reading: 1300.0, abs_floor: 1.5e-05}
          - freq_hz: [300000.0, 500000.0]
            limits:
              24h:   {ppm_reading: 1500.0, abs_floor: 3e-05}
              90d:   {ppm_reading: 1700.0, abs_floor: 3e-05}
              180d:  {ppm_reading: 1700.0, abs_floor: 3e-05}
              1y:    {ppm_reading: 1800.0, abs_floor: 3e-05}
          - freq_hz: [500000.0, 1000000.0]
            limits:
              24h:   {ppm_reading: 4000.0, abs_floor: 4e-05}
              90d:   {ppm_reading: 4400.0, abs_floor: 4e-05}
              180d:  {ppm_reading: 4700.0, abs_floor: 4e-05}
              1y:    {ppm_reading: 4800.0, abs_floor: 4e-05}

      - fs: 0.022
        range_id: AC22MV
        resolution: 1e-08
        min_out: 0.0022       # 10 % of range (guide 11.2)
        source_impedance_ohm: 50.0   # guide 18.4 operating characteristics
        bands:
          - freq_hz: [10.0, 20.0]
            limits:
              24h:   {ppm_reading: 500.0, abs_floor: 6e-06}
              90d:   {ppm_reading: 550.0, abs_floor: 6e-06}
              180d:  {ppm_reading: 600.0, abs_floor: 6e-06}
              1y:    {ppm_reading: 600.0, abs_floor: 6e-06}
          - freq_hz: [20.0, 40.0]
            limits:
              24h:   {ppm_reading: 200.0, abs_floor: 6e-06}
              90d:   {ppm_reading: 220.0, abs_floor: 6e-06}
              180d:  {ppm_reading: 230.0, abs_floor: 6e-06}
              1y:    {ppm_reading: 240.0, abs_floor: 6e-06}
          - freq_hz: [40.0, 20000.0]
            limits:
              24h:   {ppm_reading: 100.0, abs_floor: 6e-06}
              90d:   {ppm_reading: 110.0, abs_floor: 6e-06}
              180d:  {ppm_reading: 120.0, abs_floor: 6e-06}
              1y:    {ppm_reading: 120.0, abs_floor: 6e-06}
          - freq_hz: [20000.0, 50000.0]
            limits:
              24h:   {ppm_reading: 340.0, abs_floor: 6e-06}
              90d:   {ppm_reading: 370.0, abs_floor: 6e-06}
              180d:  {ppm_reading: 390.0, abs_floor: 6e-06}
              1y:    {ppm_reading: 410.0, abs_floor: 6e-06}
          - freq_hz: [50000.0, 100000.0]
            limits:
              24h:   {ppm_reading: 800.0, abs_floor: 8e-06}
              90d:   {ppm_reading: 900.0, abs_floor: 8e-06}
              180d:  {ppm_reading: 950.0, abs_floor: 8e-06}
              1y:    {ppm_reading: 950.0, abs_floor: 8e-06}
          - freq_hz: [100000.0, 300000.0]
            limits:
              24h:   {ppm_reading: 1100.0, abs_floor: 1.5e-05}
              90d:   {ppm_reading: 1200.0, abs_floor: 1.5e-05}
              180d:  {ppm_reading: 1300.0, abs_floor: 1.5e-05}
              1y:    {ppm_reading: 1300.0, abs_floor: 1.5e-05}
          - freq_hz: [300000.0, 500000.0]
            limits:
              24h:   {ppm_reading: 1500.0, abs_floor: 3e-05}
              90d:   {ppm_reading: 1700.0, abs_floor: 3e-05}
              180d:  {ppm_reading: 1700.0, abs_floor: 3e-05}
              1y:    {ppm_reading: 1800.0, abs_floor: 3e-05}
          - freq_hz: [500000.0, 1000000.0]
            limits:
              24h:   {ppm_reading: 4000.0, abs_floor: 4e-05}
              90d:   {ppm_reading: 4400.0, abs_floor: 4e-05}
              180d:  {ppm_reading: 4700.0, abs_floor: 4e-05}
              1y:    {ppm_reading: 4800.0, abs_floor: 4e-05}

      - fs: 0.22
        range_id: AC220MV
        resolution: 1e-07
        min_out: 0.022       # 10 % of range (guide 11.2)
        source_impedance_ohm: 50.0   # guide 18.4 operating characteristics
        bands:
          - freq_hz: [10.0, 20.0]
            limits:
              24h:   {ppm_reading: 500.0, abs_floor: 1.6e-05}
              90d:   {ppm_reading: 550.0, abs_floor: 1.6e-05}
              180d:  {ppm_reading: 600.0, abs_floor: 1.6e-05}
              1y:    {ppm_reading: 600.0, abs_floor: 1.6e-05}
          - freq_hz: [20.0, 40.0]
            limits:
              24h:   {ppm_reading: 200.0, abs_floor: 1e-05}
              90d:   {ppm_reading: 220.0, abs_floor: 1e-05}
              180d:  {ppm_reading: 230.0, abs_floor: 1e-05}
              1y:    {ppm_reading: 240.0, abs_floor: 1e-05}
          - freq_hz: [40.0, 20000.0]
            limits:
              24h:   {ppm_reading: 95.0, abs_floor: 1e-05}
              90d:   {ppm_reading: 100.0, abs_floor: 1e-05}
              180d:  {ppm_reading: 110.0, abs_floor: 1e-05}
              1y:    {ppm_reading: 110.0, abs_floor: 1e-05}
          - freq_hz: [20000.0, 50000.0]
            limits:
              24h:   {ppm_reading: 300.0, abs_floor: 1e-05}
              90d:   {ppm_reading: 330.0, abs_floor: 1e-05}
              180d:  {ppm_reading: 350.0, abs_floor: 1e-05}
              1y:    {ppm_reading: 360.0, abs_floor: 1e-05}
          - freq_hz: [50000.0, 100000.0]
            limits:
              24h:   {ppm_reading: 750.0, abs_floor: 3e-05}
              90d:   {ppm_reading: 800.0, abs_floor: 3e-05}
              180d:  {ppm_reading: 850.0, abs_floor: 3e-05}
              1y:    {ppm_reading: 900.0, abs_floor: 3e-05}
