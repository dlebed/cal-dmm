  # ----------------------------------------------------------------- WBV ---
  # Wideband ac voltage, Option 5700A-03 ([MS5] change #1, which replaces
  # OM p.1-42 entirely -- see docs/5700a/fluke5700a-wideband-specifications.md for
  # the transcription and the band arithmetic).  99 % confidence, +/-5 C from
  # calibration temperature, specified TO THE END OF THE CABLE AND ITS 50 OHM
  # TERMINATION.  Each band is the absolute-uncertainty row (stated for
  # 30 Hz - 500 kHz) plus the amplitude-flatness row for frequencies outside
  # it, floors added linearly.
  #
  # Footnote [1] of the flatness table ([MS5] lines 66-67, PDF p.2; [MS9]
  # lines 1467-1468, PDF p.26) -- "For output voltages < 50 % of full range in
  # the 33 mV, 110 mV, 330 mV, 1.1 V, and 3.5 V ranges, add 0.1 % to the
  # amplitude flatness specification" -- is carried as a `below_frac_adder` on
  # each band of those five ranges.  It is stated per BAND, not per range, and
  # deliberately: it adds to the *amplitude flatness* specification, and the
  # 30 Hz - 500 kHz band is the one band whose limit uses no flatness row at
  # all (it is the band the absolute-uncertainty table is stated for).  The
  # three ranges the footnote does not name -- 1.1 mV, 3.3 mV, 11 mV -- carry
  # no adder anywhere.
  #
  # NOT carried: the flatness tempco column, harmonic distortion.  A coaxial
  # 50 ohm output: two-wire only, no external sense, no rcomp.
  #
  # `source_impedance_ohm: 50` below is the truth about the hardware, but --
  # unlike the millivolt ranges of DCV/ACV -- it must NOT drive an input-loading
  # correction: "Specifications apply to the end of the cable and 50 Ohm
  # termination used for calibration" ([OM 1996] line 2528, PDF p.60; [MS9]
  # line 1431, PDF p.26), so the load is already inside the stated value and
  # dividing it out again would be a bias, not a correction.
  # `cal.engine._loading` excludes WBV for exactly that reason (L83).
  - quantity: WBV
    func: WBV
    connections: [2w]
    settle_s: 7.0            # < 120 Hz; 5 s to 1.2 MHz, 0.5 s above
    ranges:
      - fs: 0.0011
        range_id: WB1_1MV
        resolution: 1e-08
        min_out: 0.0003     # 300 uV (-57 dBm) overall minimum
