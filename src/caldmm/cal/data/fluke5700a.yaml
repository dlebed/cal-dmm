  # -------------------------------------------------------------- Resistance --
  # guide 18.5, 99 % confidence, +/- ppm OF THE CHARACTERIZED VALUE.  This is
  # a discrete catalogue of 17 values plus a short (guide 11.2); anything else
  # faults.  `characterized: true` on every range is the machine-readable form
  # of "OUT? is the reference, not the nominal you asked for" -- a 1 Ohm
  # setting may sit 500 ppm away from 1.000000 Ohm.
  #
  # `discrete: true` is the other half of that, and it is the one that bites:
  # these are 18 catalogue entries, not a ladder.  Without it, select_range's
  # "smallest range that holds the value" rule sends a characterized 19 kOhm
  # readback of 19003.8 Ohm to the 100 kOhm entry -- a 16 ppm specification
  # where 14 ppm applies -- and a 19 MOhm readback to 100 MOhm, where the
  # four-wire specification does not even exist.  Every step of that ladder is
  # LOOSER, so every one of them passes a calibrator that should fail.  A
  # discrete range holds only its own nominal; resolve a readback by range_id.
  #
  # Per-range `connections` is not decoration either: four-wire sensing exists
  # for every value EXCEPT 100 MOhm, and RCOMP two-wire compensation only at
  # 19 kOhm and below (fault 836 above it).
  #
  # THE FIGURES ABOVE ARE FOUR-WIRE.  [OM 1996] line 1952 (PDF p.48), note 1 to
  # the primary table: "Specifications apply to displayed value. 4-wire
  # connections, except 100 MOhm."  The two-wire figure is a separate column of
  # the secondary table, "Two-Wire Adder / Active Compensation [4] / Lead
  # Resistance 0.1 Ohm, 1 Ohm / +/-mOhm" ([OM 1996] lines 1960-2009,
  # PDF p.49), and it is carried per range as `connection_adders`, because one
  # figure cannot cover a table that runs from 2.5 mOhm to 100 mOhm.  Two
  # readings of that column had to be pinned down:
  #
  #  * WHICH LEAD COLUMN.  The 0.1 Ohm column, for three reasons: this bench
  #    runs Fluke 5440A-7002 low-thermal leads, which are well under 1 Ohm;
  #    the 5700A is normally the DUT here, and for a DUT the smaller adder is
  #    the tighter, conservative limit (the 1 Ohm column is 2 mOhm looser on
  #    0 - 190 Ohm, which could pass a calibrator that should fail); and it is
  #    the column the audit's own acceptance figures quote.
  #
  #    A BENCH WITH HEAVIER LEADS SWITCHES TO THE 1 OHM COLUMN, which is
  #    4.5 mOhm on 0 - 190 Ohm (i.e. 4 + 4uV/Im) and 15 / 15 / 60 / 120 mOhm
  #    at 1 k / 1.9 k / 10 k / 19 k.  Both columns are quoted beside every
  #    range below, so the switch is a one-line edit per range.
  #  * WHAT Im IS.  The 0 - 190 Ohm rows read "2 + 4uV/Im" mOhm (0.1 Ohm
  #    leads), where "Im = Current produced by Ohmmeter (A)" -- so the term
  #    grows as the meter's ohms current falls.  The largest it can be while
  #    the primary figure still applies at all is at Im = IL = 8 mA (below IL
  #    the load-current derating below takes over), which is
  #    4 uV / 8 mA = 0.5 mOhm.  That is what is carried: 2 + 0.5 = 2.5 mOhm.
  #    A meter sourcing 1 mA into a two-wire compensated point is outside the
  #    specification twice over.
  #
  # Note 4 ([OM 1996] lines 2018-2020, PDF p.49) bounds the whole mechanism:
  # "Active two-wire compensation may be selected for values less than
  # 100 kOhm ... limited to 11 mA load, and to 2 V burden.  Two-wire
  # compensation can be used only with Ohm-meters that source continuous (not
  # pulsed) dc current."
  #
  # THE FIGURES ABOVE ALSO ASSUME A LOAD CURRENT INSIDE IL - IU, the "Full
  # Spec Load Range" of the same secondary table ([OM 1996] lines 1977-2009,
  # PDF p.49), whose note 3 says "Refer to current derating factors table for
  # loads outside of this range".  Each range carries that window and the
  # constants of the "Current Derating Factors" table ([OM 1996] lines
  # 2030-2085, PDF p.50) as `load_current:`.  They are TEST CONDITIONS, not
  # tolerance terms: which current flows depends on the paired meter's ohms
  # range, which a spec table cannot know, so evaluate_limit ignores them and
  # plan generation must not.  This matters: a 3458A or a 34401A reads 19 Ohm
  # at 1 mA where IL is 8 mA, which adds 14 ppm to a 31 ppm one-year figure,
  # and reads 1 Ohm at 1 mA, which adds 262 ppm to a 110 ppm figure.
  #
  # The keys, and the manual's own arithmetic ([OM 1996] lines 2073-2085,
  # PDF p.50):
  #
  #   min_a  max_a  imax_a   IL, IU and IMAX, in AMPERES (SI, like every other
  #                          physical quantity in this file).
  #   unit                   the unit I and IL are expressed in for the
  #                          under-current equation: mA for the short through
  #                          1.9 kOhm, uA from 10 kOhm up.
  #   k_under_4w             K in  Error = K(IL - I)/(IL x I)  for I < IL,
  #                          four-wire.
  #   k_under_4w_unit        what that error comes out in: ppm everywhere
  #                          except the short, where the manual says mOhm
  #                          (a ppm of a 0 Ohm output would be zero).
  #   k_under_2w             the same K for an ACTIVELY COMPENSATED two-wire
  #                          connection; always mOhm; blank in the manual
  #                          exactly where two-wire compensation is not
  #                          offered, i.e. at 100 kOhm and above.
  #   over_unit              the unit I and IU are expressed in for the
  #                          over-current equation -- NOT always the same as
  #                          `unit`: the manual switches at 1.9 k/10 k for the
  #                          under-current rule but at 19 k/100 k for the
  #                          over-current one, so the 10 kOhm and 19 kOhm rows
  #                          take uA in one equation and mA in the other.
  #   k_over_4w              K in  Error(ppm) = K(I^2 - IU^2)  for
  #                          IU < I < IMAX.  Blank for the short and for
  #                          100 MOhm, whose IU is already IMAX or whose cell
  #                          the manual leaves empty.
  #
  # No settle_s: the manuals never state a resistance settling time.
  - quantity: RES
    func: OHMS
    connections:
      4w: {}
      2w:
        # The manual states no adder for an UNCOMPENSATED two-wire hookup and
        # this file invents none.  [OM 1996] lines 5226-5231 (PDF p.118): the
        # active compensation exists "to remove errors introduced by
        # resistance in the path between the front panel terminals and the
        # precision resistor", and line 5237 says the plain two-wire hookup of
        # Figure 4-4B is to be used "only if lead resistances are
        # insignificant".  So the four-wire figure holds at the terminals and
        # the lead resistance is the operator's to bound -- not a number the
        # calibrator guarantees.
        note: >-
          uncompensated: the four-wire figure is used unmodified and the lead
          resistance between the terminals and the meter is the operator's,
          not the calibrator's ([OM 1996] lines 5236-5238, PDF p.118).  The
          one exception is 100 MOhm, which has no four-wire mode at all and
          whose primary-table figure therefore already is the two-wire figure.
      2w_rcomp: {}
    ranges:
      - fs: 0.0
        range_id: OHM0
        characterized: true
        discrete: true
        connections: [4w, 2w, 2w_rcomp]
        note: "the short.  fs is genuinely 0, so the whole specification
               is the 50 uOhm floor -- there is no range term to scale"
        # Two-wire active-compensation adder: [OM 1996] line 1977
        #   (PDF p.49): "2 + 4uV/Im" mOhm with 0.1 Ohm leads, and
        #   4 uV / 8 mA = 0.5 mOhm at Im = IL.  1 Ohm leads: 4.5 mOhm.
        connection_adders: {2w_rcomp: {abs_floor: 2.5e-3}}
        # Full-spec load range and IMAX: [OM 1996] line 1977
        #   (PDF p.49).  Derating K: line 2037 (PDF p.50).
        # k_under_4w is in mOhm here, not ppm: the manual says
        # "Error is in mOhm for ... four-wire short".  IU is IMAX,
        # so the derating table's over-current cell is blank.
        load_current: {min_a: 8.0e-3, max_a: 500.0e-3, imax_a: 500.0e-3,
                       unit: mA, k_under_4w: 0.3, k_under_4w_unit: mohm,
                       k_under_2w: 4.4}
        limits:
          24h:   {abs_floor: 5e-05}
          90d:   {abs_floor: 5e-05}
          180d:  {abs_floor: 5e-05}
          1y:    {abs_floor: 5e-05}

      - fs: 1.0
        range_id: OHM1
        characterized: true
        discrete: true
        connections: [4w, 2w, 2w_rcomp]
        note: "characterized value may sit up to 500 ppm from nominal"
        # Two-wire active-compensation adder: [OM 1996] line 1980
        #   (PDF p.49): "2 + 4uV/Im" mOhm with 0.1 Ohm leads, and
        #   4 uV / 8 mA = 0.5 mOhm at Im = IL.  1 Ohm leads: 4.5 mOhm.
        connection_adders: {2w_rcomp: {abs_floor: 2.5e-3}}
        # Full-spec load range and IMAX: [OM 1996] line 1980
        #   (PDF p.49).  Derating K: line 2039 (PDF p.50).
        load_current: {min_a: 8.0e-3, max_a: 100.0e-3, imax_a: 700.0e-3,
                       unit: mA, k_under_4w: 300.0, k_under_4w_unit: ppm,
                       k_under_2w: 4.4, over_unit: mA, k_over_4w: 4.0e-5}
        limits:
          24h:   {ppm_reading: 85.0}
          90d:   {ppm_reading: 95.0}
          180d:  {ppm_reading: 100.0}
          1y:    {ppm_reading: 110.0}

      - fs: 1.9
