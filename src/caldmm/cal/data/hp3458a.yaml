      # -------------------------------------------------------- 1000 V ac --
      # `fs` is the range NAME, 1000 V.  p.9, first paragraph, says so in as
      # many words and scopes it to ac explicitly: "In ACV and ACl, the
      # specification is percent of reading plus percent of range.  Range means
      # the name of the scale, e.g. 1 V, 10 V, etc.; range does not mean the
      # full-scale reading, e.g. 1.2 V, 12 V, etc."  The usable full scale is
      # 700.0000 V rms (p.25 "Full scale" column), carried as max_out on every
      # band, so above it there is no reading rather than a loose one.
      #     SYNC 10 %  of 700 V = 70 V = 0.07 fs
      #     ANA  1/20  of 700 V = 35 V = 0.035 fs
      #     RNDM 5 %   of 700 V = 35 V = 0.035 fs   -> most restrictive 0.07
      - fs: 1000.0
        range_arg: 1000.0
        resolution: 1.0e-4            # 100 uV in SYNC (p.25)
        input_impedance_ohm: 1.0e+6   # 1 MOhm +/-2 % with <140 pF
        # No `overrange:` here, unlike every other ac range.  The p.25 "Full
        # scale" column is 700.0000 V rms, BELOW the range name, so there is
        # no headroom to claim -- max_out on each band is the real ceiling.
        # The UG RANGE table prints 1050 V for this row like the dc one
        # (3458a-user-guide.txt:10254, PDF p.273), but the rated input is
        # +/- 1000 V pk -- 707 V rms (3458a-datasheet.txt:1312, PDF p.30
        # "Maximum input") -- and the specification stops at 700 V rms, so the
        # accuracy table is the figure that governs.
        min_reading_frac: 0.07
        min_reading_frac_by_mode:   # ANA p.28 fn 3 and RNDM p.30 fn 1: 1/20 of full scale
          sync: 0.07
          sync_wide: 0.07
          ana: 0.0525
          rndm: 0.0525
          rndm_wide: 0.0525
        note: "full scale is 700.0000 V rms, not 1000 V -- see max_out on each band"
        bands:
          - {freq_hz: [1, 40], modes: [sync], max_out: 700.0,
             limits: &L46_004_0004   # p.25 SYNC
               {24h: &TL46_004_0004 {pct_reading: 0.04, pct_range: 0.004},
                90d: *TL46_004_0004, 1y: *TL46_004_0004, 2y: *TL46_004_0004},
             tempco: {pct_reading_per_c: 0.001, pct_range_per_c: 0.0001}}
          - {freq_hz: [40, 1000], modes: [sync], max_out: 700.0,
             limits: &L47_004_0002   # p.25 SYNC
               {24h: &TL47_004_0002 {pct_reading: 0.04, pct_range: 0.002},
                90d: *TL47_004_0002, 1y: *TL47_004_0002, 2y: *TL47_004_0002},
             tempco: {pct_reading_per_c: 0.001, pct_range_per_c: 0.0001}}
          - {freq_hz: [1000, 20000], modes: [sync], max_out: 700.0,
             limits: &L48_006_0002   # p.25 SYNC
               {24h: &TL48_006_0002 {pct_reading: 0.06, pct_range: 0.002},
                90d: *TL48_006_0002, 1y: *TL48_006_0002, 2y: *TL48_006_0002},
             tempco: {pct_reading_per_c: 0.001, pct_range_per_c: 0.0001}}
          - {freq_hz: [20000, 50000], modes: [sync], max_out: 700.0,
             limits: *L43_012_0002,   # p.25 SYNC
             tempco: {pct_reading_per_c: 0.001, pct_range_per_c: 0.0001}}
          - {freq_hz: [50000, 100000], modes: [sync], max_out: 700.0,
             limits: &L49_03_0002   # p.25 SYNC
               {24h: &TL49_03_0002 {pct_reading: 0.3, pct_range: 0.002},
                90d: *TL49_03_0002, 1y: *TL49_03_0002, 2y: *TL49_03_0002},
             tempco: {pct_reading_per_c: 0.001, pct_range_per_c: 0.0001}}
          - {freq_hz: [10, 20], modes: [ana], max_out: 700.0,
             limits: &L50_042_003   # p.28 ANA
               {24h: &TL50_042_003 {pct_reading: 0.42, pct_range: 0.03},
                90d: *TL50_042_003, 1y: *TL50_042_003, 2y: *TL50_042_003},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [20, 40], modes: [ana], max_out: 700.0,
             limits: &L51_017_003   # p.28 ANA
               {24h: &TL51_017_003 {pct_reading: 0.17, pct_range: 0.03},
                90d: *TL51_017_003, 1y: *TL51_017_003, 2y: *TL51_017_003},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [40, 100], modes: [ana], max_out: 700.0,
             limits: &L52_008_002   # p.28 ANA
               {24h: &TL52_008_002 {pct_reading: 0.08, pct_range: 0.02},
                90d: *TL52_008_002, 1y: *TL52_008_002, 2y: *TL52_008_002},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [100, 20000], modes: [ana], max_out: 700.0,
             limits: &L53_006_002   # p.28 ANA
               {24h: &TL53_006_002 {pct_reading: 0.06, pct_range: 0.02},
                90d: *TL53_006_002, 1y: *TL53_006_002, 2y: *TL53_006_002},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [20000, 50000], modes: [ana], max_out: 700.0,
             limits: *L30_015_004,   # p.28 ANA
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [50000, 100000], modes: [ana], max_out: 700.0,
             limits: &L54_06_02   # p.28 ANA
               {24h: &TL54_06_02 {pct_reading: 0.6, pct_range: 0.2},
                90d: *TL54_06_02, 1y: *TL54_06_02, 2y: *TL54_06_02},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [20, 100000], modes: [rndm], max_out: 700.0,
