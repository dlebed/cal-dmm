          - {freq_hz: [10, 20], modes: [ana],
             limits: &L26_04_002   # p.28 ANA
               {24h: &TL26_04_002 {pct_reading: 0.4, pct_range: 0.02},
                90d: *TL26_04_002, 1y: *TL26_04_002, 2y: *TL26_04_002},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [20, 40], modes: [ana],
             limits: &L27_015_002   # p.28 ANA
               {24h: &TL27_015_002 {pct_reading: 0.15, pct_range: 0.02},
                90d: *TL27_015_002, 1y: *TL27_015_002, 2y: *TL27_015_002},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [40, 100], modes: [ana],
             limits: &L28_006_001   # p.28 ANA
               {24h: &TL28_006_001 {pct_reading: 0.06, pct_range: 0.01},
                90d: *TL28_006_001, 1y: *TL28_006_001, 2y: *TL28_006_001},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [100, 20000], modes: [ana],
             limits: &L29_002_001   # p.28 ANA
               {24h: &TL29_002_001 {pct_reading: 0.02, pct_range: 0.01},
                90d: *TL29_002_001, 1y: *TL29_002_001, 2y: *TL29_002_001},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [20000, 50000], modes: [ana],
             limits: &L30_015_004   # p.28 ANA
               {24h: &TL30_015_004 {pct_reading: 0.15, pct_range: 0.04},
                90d: *TL30_015_004, 1y: *TL30_015_004, 2y: *TL30_015_004},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [50000, 100000], modes: [ana],
             limits: &L31_06_008   # p.28 ANA
               {24h: &TL31_06_008 {pct_reading: 0.6, pct_range: 0.08},
                90d: *TL31_06_008, 1y: *TL31_06_008, 2y: *TL31_06_008},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [100000, 250000], modes: [ana],
             limits: &L32_20_05   # p.28 ANA
               {24h: &TL32_20_05 {pct_reading: 2.0, pct_range: 0.5},
                90d: *TL32_20_05, 1y: *TL32_20_05, 2y: *TL32_20_05},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [250000, 500000], modes: [ana],
             limits: &L33_30_06   # p.28 ANA
               {24h: &TL33_30_06 {pct_reading: 3.0, pct_range: 0.6},
                90d: *TL33_30_06, 1y: *TL33_30_06, 2y: *TL33_30_06},
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.0}}
          - {freq_hz: [500000, 1000000], modes: [ana],
             limits: &L34_50_20   # p.28 ANA
