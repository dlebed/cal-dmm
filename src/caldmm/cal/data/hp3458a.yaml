          - {freq_hz: [20, 100000], modes: [rndm_wide], max_out: 700.0,
             limits: *L23_03_001,   # p.31 RNDM, both ACBAND regimes; tempco p.30 fn 1
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.02}}
          - {freq_hz: [45, 100000], modes: [sync_wide], max_out: 700.0,
             limits: *L23_03_001,   # p.25 SYNC ACBAND>2MHz
             tempco: {pct_reading_per_c: 0.002, pct_range_per_c: 0.02}}
